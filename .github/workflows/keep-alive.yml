name: InsForge Backend Keep-Alive Cron

on:
  schedule:
    # Runs every 2 days at midnight UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping-insforge:
    runs-on: ubuntu-latest
    steps:
      - name: Ping InsForge Database via Next.js API
        run: |
          echo "Pinging InsForge Database Keep-Alive API..."
          curl -s -f https://59y4evms.ap-southeast.insforge.app/rest/v1/categories?select=id&limit=1 \
            -H "apikey: ik_18f67acf6d7bb06889405d16b6e6d5e5" \
            -H "Authorization: Bearer ik_18f67acf6d7bb06889405d16b6e6d5e5" || true
          echo "InsForge DB ping executed successfully!"
